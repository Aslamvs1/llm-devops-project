name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t llm-devops-app:ci .

      - name: Run container
        run: docker run -d --name llm-api-test -p 8001:8001 llm-devops-app:ci

      - name: Test API
        run: |
          sleep 5
          curl -f http://localhost:8001/

      - name: Stop test container
        if: always()
        run: docker rm -f llm-api-test

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Trust EC2 host
        run: |
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd ~/llm-devops-project && \
             git pull && \
             sudo docker build -t llm-devops-app:latest . && \
             sudo docker compose up -d"